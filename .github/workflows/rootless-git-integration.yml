name: Rootless managed-workspace Git integration

on:
  pull_request:
    paths:
      - "apps/agent/src/**"
      - "apps/web/src/**"
      - "packages/contracts/**"
      - "packages/project-options/**"
      - "deploy/ubuntu/**"
      - "docs/installation-ubuntu-24.04.md"
      - "e2e/ubuntu-installation.acceptance.spec.ts"
      - "playwright.installation.config.ts"
      - "tooling/acceptance/**"
      - "tooling/install-preflight.mjs"
      - "tooling/tests/install-preflight.test.mjs"
      - ".github/scripts/ubuntu-installation-acceptance.sh"
      - ".github/workflows/rootless-git-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootless-git-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rootless-git:
    name: Disposable rootless Docker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "11.13.0"
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace-stop terminal-retirement regression tests
        run: pnpm exec vitest run --project @devspace/web apps/web/src/server/execution.test.ts

      - name: Run Agent workspace-stop execution regression tests
        run: >-
          pnpm exec vitest run --project @devspace/agent
          apps/agent/src/execution-manager.test.ts apps/agent/src/operation-executor.test.ts

      - name: Prepare official rootless Docker components
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          printf 'DEVSPACE_ROOTLESS_RUNNER_TEMP=%s\n' "$runner_temp" >>"$GITHUB_ENV"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$root" || -L "$root" ]]; then
            echo "Refusing to reuse an existing test root: $root" >&2
            exit 1
          fi
          install -d -m 0700 "$root" "$root/docker-config"

          # Install only rootless prerequisites. Do not install, start, or query the runner's
          # pre-existing rootful Docker service.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor ca-certificates curl dbus-user-session fuse-overlayfs iptables ncurses-bin ncurses-term slirp4netns uidmap

          # Use Docker's signed package repository for the officially supported rootless
          # components. Refuse any package plan that would install, remove, or replace the
          # runner's pre-existing Docker engine or CLI.
          sudo install -m 0755 -d /etc/apt/keyrings
          if [[ -e /etc/apt/keyrings/devspace-rootless-ci.asc || -e /etc/apt/sources.list.d/devspace-rootless-ci.list ]]; then
            echo "Refusing to overwrite existing temporary Docker repository configuration" >&2
            exit 1
          fi
          touch "$root/apt-key-created"
          curl --fail --silent --show-error --location \
            https://download.docker.com/linux/ubuntu/gpg \
            | sudo tee /etc/apt/keyrings/devspace-rootless-ci.asc >/dev/null
          sudo chmod a+r /etc/apt/keyrings/devspace-rootless-ci.asc
          . /etc/os-release
          codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          architecture="$(dpkg --print-architecture)"
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/devspace-rootless-ci.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
            "$architecture" "$codename" \
            >"$root/docker-source.list"
          touch "$root/apt-source-created"
          sudo tee /etc/apt/sources.list.d/devspace-rootless-ci.list \
            <"$root/docker-source.list" >/dev/null
          sudo apt-get update
          engine_package_version="$(dpkg-query -W -f='${Version}' docker-ce)"
          cli_package_version="$(dpkg-query -W -f='${Version}' docker-ce-cli)"
          engine_binary_version="$(dockerd --version | sed -En 's/^Docker version ([0-9.]+),.*/\1/p')"
          engine_deb_version="$(sed -E 's/^[0-9]+://' <<<"$engine_package_version" | sed -E 's/-.*$//')"
          if [[ -z "$engine_binary_version" || "$engine_binary_version" != "$engine_deb_version" ]]; then
            echo "Installed dockerd binary and package version do not match: $engine_binary_version / $engine_package_version" >&2
            exit 1
          fi
          if ! apt-cache madison docker-ce-rootless-extras \
            | awk -F '|' -v expected="$engine_package_version" '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); if ($2 == expected) found = 1 } END { exit !found }'; then
            echo "Docker's repository has no rootless-extras package matching installed engine $engine_package_version" >&2
            exit 1
          fi
          package_specs=(
            "docker-ce-rootless-extras=$engine_package_version"
            "docker-ce=$engine_package_version"
            "docker-ce-cli=$cli_package_version"
          )
          package_plan="$(sudo apt-get --simulate install --no-install-recommends --no-upgrade "${package_specs[@]}")"
          printf '%s\n' "$package_plan"
          if grep -E '^Remv ' <<<"$package_plan"; then
            echo "Rootless prerequisite installation would remove an existing package" >&2
            exit 1
          fi
          if grep -E '^(Inst|Remv) (docker-ce|docker-ce-cli|docker.io|moby-engine|moby-cli|containerd.io)([ :]|$)' <<<"$package_plan"; then
            echo "Rootless prerequisite installation would modify the runner's pre-existing Docker engine or CLI" >&2
            exit 1
          fi
          sudo apt-get install --yes --no-install-recommends --no-upgrade "${package_specs[@]}"
          rootless_script="$(command -v dockerd-rootless.sh)"
          rootlesskit="$(command -v rootlesskit)"
          test -x "$rootless_script"
          test -x "$rootlesskit"
          command -v dockerd >/dev/null
          command -v newuidmap >/dev/null
          command -v newgidmap >/dev/null
          command -v slirp4netns >/dev/null

          # Give this VM user one unused, private 65,536-ID mapping range if the image did not
          # already provision one. Select a range disjoint from every existing subuid/subgid.
          range_start="$(python3 - "$USER" <<'PY'
          import pathlib, pwd, sys
          user = sys.argv[1]
          uid = str(pwd.getpwnam(user).pw_uid)
          needed = 65536
          paths = (pathlib.Path('/etc/subuid'), pathlib.Path('/etc/subgid'))
          all_ranges = []
          complete = True
          for path in paths:
              ranges = []
              assigned = 0
              for line in path.read_text().splitlines() if path.exists() else []:
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, count = int(fields[1]), int(fields[2])
                  except ValueError:
                      continue
                  all_ranges.append((start, start + count))
                  if fields[0] in (user, uid):
                      ranges.append((start, start + count))
                      assigned += count
              complete = complete and assigned >= needed
          if complete:
              print('existing')
          else:
              candidate = 1_000_000
              while any(candidate < end and start < candidate + needed for start, end in all_ranges):
                  candidate += needed
              print(candidate)
          PY
          )"
          if [[ "$range_start" != existing ]]; then
            range_end=$((range_start + 65535))
            sudo usermod --add-subuids "$range_start-$range_end" --add-subgids "$range_start-$range_end" "$USER"
          fi
          python3 - "$USER" <<'PY'
          import pathlib, pwd, sys
          user = sys.argv[1]
          uid = str(pwd.getpwnam(user).pw_uid)
          needed = 65536
          for path in (pathlib.Path('/etc/subuid'), pathlib.Path('/etc/subgid')):
              total = 0
              for line in path.read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) == 3 and fields[0] in (user, uid):
                      total += int(fields[2])
              if total < needed:
                  raise SystemExit(f'{path} does not provide 65,536 IDs for {user}')
          PY
          uid="$(id -u)"
          delegate_dropin="/etc/systemd/system/user@.service.d/devspace-rootless-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.conf"
          if [[ -e "$delegate_dropin" || -L "$delegate_dropin" ]]; then
            echo "Refusing to overwrite an existing systemd delegation drop-in: $delegate_dropin" >&2
            exit 1
          fi
          touch "$root/systemd-delegate-created"
          sudo install -d -m 0755 /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' \
            | sudo tee "$delegate_dropin" >/dev/null
          sudo systemctl daemon-reload
          if [[ "$(systemctl is-active "user@$uid.service" 2>/dev/null || true)" == active ]]; then
            sudo systemctl restart "user@$uid.service"
          elif [[ "$(loginctl show-user "$USER" --property=Linger --value 2>/dev/null || true)" != yes ]]; then
            sudo loginctl enable-linger "$USER"
            touch "$root/linger-enabled"
          fi
          printf 'Prepared rootless Docker tools and subordinate ID mappings in the hosted VM.\n'

      - name: Start and verify isolated rootless Docker daemon
        id: daemon
        shell: bash
        run: bash -euo pipefail .github/scripts/rootless-docker-start.sh
      - name: Run real managed-workspace Git acceptance test
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          socket="$root/runtime/docker.sock"
          test -S "$socket"
          test -f "$root/runtime/dockerd.pid"
          test "$DEVSPACE_TEST_DOCKER_SOCKET_PATH" = "$socket"
          export DEVSPACE_TEST_GIT_IMAGE=mcr.microsoft.com/devcontainers/base:ubuntu-24.04
          report="$root/vitest.json"
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            DEVSPACE_TEST_DOCKER_SOCKET_PATH="$socket" \
            DEVSPACE_TEST_GIT_IMAGE="$DEVSPACE_TEST_GIT_IMAGE" \
            DOCKER_CONFIG="$root/docker-config" \
            pnpm exec vitest run \
              --project @devspace/agent \
              apps/agent/src/managed-workspaces.rootless.integration.test.ts \
              --reporter=json \
              --outputFile="$report"
          node --input-type=module - "$report" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.argv[2], 'utf8'));
          const assertions = (report.testResults ?? []).flatMap((suite) => suite.assertionResults ?? []);
          if (report.success !== true
            || report.numTotalTests !== 1
            || report.numPassedTests !== 1
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.numTodoTests !== 0
            || assertions.length !== 1
            || assertions[0]?.status !== 'passed'
            || !String(assertions[0]?.fullName ?? assertions[0]?.title ?? '').includes('real managed containers provide isolated, persistent workspace Git repositories')) {
            console.error(JSON.stringify(report, null, 2));
            throw new Error('Rootless managed-workspace acceptance must run exactly once and pass; skipped tests are failures.');
          }
          console.log('Verified one passed real-container acceptance test with no skipped or pending tests.');
          NODE
          test -S "$socket"

      - name: Run real Codex artifact staging acceptance and benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          socket="$root/runtime/docker.sock"
          test -S "$socket"
          test "$DEVSPACE_TEST_DOCKER_SOCKET_PATH" = "$socket"
          report="$root/artifact-staging-vitest.json"
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            DEVSPACE_TEST_DOCKER_SOCKET_PATH="$socket" \
            DEVSPACE_TEST_GIT_IMAGE=mcr.microsoft.com/devcontainers/base:ubuntu-24.04 \
            DOCKER_CONFIG="$root/docker-config" \
            pnpm exec vitest run \
              --project @devspace/agent \
              apps/agent/src/codex-app-server/artifact-stager.rootless.integration.test.ts \
              --reporter=json \
              --outputFile="$report"
          node --input-type=module - "$report" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.argv[2], 'utf8'));
          const assertions = (report.testResults ?? []).flatMap((suite) => suite.assertionResults ?? []);
          if (report.success !== true
            || report.numTotalTests !== 1
            || report.numPassedTests !== 1
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.numTodoTests !== 0
            || assertions.length !== 1
            || assertions[0]?.status !== 'passed'
            || !String(assertions[0]?.fullName ?? assertions[0]?.title ?? '').includes('real rootless Docker accepts batched Codex artifact staging')) {
            console.error(JSON.stringify(report, null, 2));
            throw new Error('Rootless Codex artifact staging acceptance must run exactly once and pass; skipped tests are failures.');
          }
          console.log('Verified one passed real-rootless-Docker Codex artifact acceptance test with no skipped or pending tests.');
          NODE
          cat "$GITHUB_STEP_SUMMARY"
          test -S "$socket"

      - name: Verify pinned tmux artifact and compile terminal entries
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          artifact_root="$root/tmux-3.7c"
          if [[ -e "$artifact_root" || -L "$artifact_root" ]]; then
            echo "Refusing to reuse an existing tmux artifact directory: $artifact_root" >&2
            exit 1
          fi
          install -d -m 0700 "$artifact_root" "$artifact_root/extracted" "$artifact_root/terminfo" "$artifact_root/source"
          archive="$artifact_root/tmux-3.7c-linux-x86_64.tar.gz"
          archive_url="https://github.com/tmux/tmux-builds/releases/download/v3.7c/tmux-3.7c-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 "$archive_url" -o "$archive"
          printf '%s  %s\n' \
            'cc56bd1cc873eb6089c615f0496b072385bda8a6d944069f38564a5d49c128aa' "$archive" \
            | sha256sum --check
          mapfile -t archive_entries < <(tar -tzf "$archive")
          if [[ "${#archive_entries[@]}" -ne 1 || "${archive_entries[0]}" != tmux ]]; then
            printf 'Unexpected tmux release archive contents: %s\n' "${archive_entries[*]}" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$artifact_root/extracted"
          binary="$artifact_root/extracted/tmux"
          test -x "$binary"
          printf '%s  %s\n' \
            '7d0f1e85c5b11df7fe127ab90674c6a15663ad72a25fcf7fabadba6bbb0b29d5' "$binary" \
            | sha256sum --check
          test "$("$binary" -V)" = 'tmux 3.7c'

          terminfo="$artifact_root/terminfo"
          source_dir="$artifact_root/source"
          for terminal in xterm-256color tmux-256color; do
            infocmp -x "$terminal" >"$source_dir/$terminal.src"
            tic -x -o "$terminfo" "$source_dir/$terminal.src"
            TERMINFO="$terminfo" infocmp -x "$terminal" >/dev/null
            printf 'Compiled and verified terminfo entry: %s\n' "$terminal"
          done
          printf 'DEVSPACE_TEST_TMUX_BINARY_PATH=%s\n' "$binary" >>"$GITHUB_ENV"
          printf 'DEVSPACE_TEST_TMUX_TERMINFO_PATH=%s\n' "$terminfo" >>"$GITHUB_ENV"
          {
            echo '### Pinned tmux feasibility artifact'
            echo
            echo '- Source: [tmux/tmux-builds v3.7c](https://github.com/tmux/tmux-builds/releases/tag/v3.7c), Linux x86_64 release asset.'
            echo '- Archive and executable hashes matched the feasibility report.'
            echo '- Runner terminfo entries compiled and looked up: `xterm-256color`, `tmux-256color`.'
            echo
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run real tmux persistence feasibility gate
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          socket="$root/runtime/docker.sock"
          test -S "$socket"
          test "$DEVSPACE_TEST_DOCKER_SOCKET_PATH" = "$socket"
          test -x "$DEVSPACE_TEST_TMUX_BINARY_PATH"
          test -d "$DEVSPACE_TEST_TMUX_TERMINFO_PATH"
          report="$root/tmux-feasibility-vitest.json"
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            DEVSPACE_TEST_DOCKER_SOCKET_PATH="$socket" \
            DEVSPACE_TEST_TMUX_BINARY_PATH="$DEVSPACE_TEST_TMUX_BINARY_PATH" \
            DEVSPACE_TEST_TMUX_TERMINFO_PATH="$DEVSPACE_TEST_TMUX_TERMINFO_PATH" \
            DOCKER_CONFIG="$root/docker-config" \
            pnpm exec vitest run \
              --project @devspace/agent \
              apps/agent/src/persistent-terminals.rootless.integration.test.ts \
              --reporter=json \
              --outputFile="$report"
          node --input-type=module - "$report" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.argv[2], 'utf8'));
          const assertions = (report.testResults ?? []).flatMap((suite) => suite.assertionResults ?? []);
          if (report.success !== true
            || report.numTotalTests !== 2
            || report.numPassedTests !== 2
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.numTodoTests !== 0
            || assertions.length !== 2
            || assertions.some((assertion) => assertion.status !== 'passed'
              || !String(assertion.fullName ?? assertion.title ?? '').includes('real rootless Docker preserves the tmux shell across disposable exec clients'))) {
            console.error(JSON.stringify(report, null, 2));
            throw new Error('Both rootless tmux feasibility cases must run and pass; skipped tests are failures.');
          }
          console.log('Verified both Debian development images passed the real rootless tmux feasibility gate with no skipped or pending tests.');
          NODE
          test -S "$socket"

      - name: Show rootless test and daemon logs on failure
        if: failure()
        shell: bash
        run: |
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          root="$runner_temp/devspace-rootless-git-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -f "$root/vitest.json" ]]; then
            echo "Rootless Git integration Vitest report:"
            cat "$root/vitest.json"
          fi
          if [[ -f "$root/artifact-staging-vitest.json" ]]; then
            echo "Rootless Codex artifact staging Vitest report:"
            cat "$root/artifact-staging-vitest.json"
          fi
          if [[ -f "$root/tmux-feasibility-vitest.json" ]]; then
            echo "Rootless tmux feasibility Vitest report:"
            cat "$root/tmux-feasibility-vitest.json"
          fi
          if [[ -d "$root/tmux-3.7c" ]]; then
            echo "Pinned tmux artifact hashes and terminfo preparation state:"
            find "$root/tmux-3.7c" -maxdepth 3 -type f -print
          fi
          if [[ -f "$root/daemon.log" ]]; then cat "$root/daemon.log"; fi

      - name: Stop and remove only the disposable rootless daemon
        if: always()
        shell: bash
        run: bash -euo pipefail .github/scripts/rootless-docker-cleanup.sh

  ubuntu-installation-acceptance:
    name: Fresh Ubuntu installation and workspace acceptance (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Check out selected source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install source revision as a clean host
        shell: bash
        run: bash .github/scripts/ubuntu-installation-acceptance.sh prepare "$GITHUB_SHA"

      - name: Install Playwright Chromium dependencies
        working-directory: /opt/devspace
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise production-authenticated first-run browser workflow
        working-directory: /opt/devspace
        env:
          NODE_EXTRA_CA_CERTS: /etc/devspace/installation-test-ca.pem
        run: pnpm exec playwright test --config=playwright.installation.config.ts --project=chromium

      - name: Verify workspace host bind path and persistent state ownership
        run: bash .github/scripts/ubuntu-installation-acceptance.sh verify

      - name: Show installation service and rootless daemon logs on failure
        if: failure()
        shell: bash
        run: |
          sudo journalctl -u devspace-agent.service -n 200 --no-pager || true
          sudo journalctl -u devspace-web.service -n 200 --no-pager || true
          if getent passwd devspace-agent >/dev/null; then
            agent_uid="$(id -u devspace-agent)"
            sudo -u devspace-agent env XDG_RUNTIME_DIR="/run/user/$agent_uid" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$agent_uid/bus" \
              systemctl --user status docker.service --no-pager --full || true
            sudo -u devspace-agent env XDG_RUNTIME_DIR="/run/user/$agent_uid" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$agent_uid/bus" \
              journalctl --user -u docker.service -n 200 --no-pager || true
          fi
          if [[ -n "${INSTALL_ACCEPTANCE_ROOT:-}" && -f "$INSTALL_ACCEPTANCE_ROOT/fixtures.log" ]]; then
            cat "$INSTALL_ACCEPTANCE_ROOT/fixtures.log"
          fi

      - name: Stop services and clean disposable installation resources
        if: always()
        shell: bash
        run: bash .github/scripts/ubuntu-installation-acceptance.sh cleanup
