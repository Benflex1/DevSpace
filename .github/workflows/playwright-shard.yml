name: Playwright shard

on:
  workflow_call:
    inputs:
      shard:
        description: One-based shard index out of four.
        required: true
        type: number

permissions:
  contents: read

jobs:
  test:
    name: Playwright tests ${{ inputs.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare workspace dependencies
        run: pnpm --filter @devspace/web run prepare:deps

      - name: Run browser shard
        run: pnpm exec playwright test --shard=${{ inputs.shard }}/4

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-traces-shard-${{ inputs.shard }}-of-4
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
