name: Self-hosted runner smoke

on:
  push:
    branches:
      - chore/self-hosted-ci-runner

permissions:
  contents: read

jobs:
  smoke:
    name: Isolated runner smoke
    runs-on: [self-hosted, linux, x64, devspace-ci]
    timeout-minutes: 5

    steps:
      - name: Verify runner identity and isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "github-runner-devspace"
          test "$(id -u)" = "45001"
          test "$(id -nG)" = "github-runner-devspace"
          test "$DOCKER_HOST" = "unix:///run/user/45001/docker.sock"
          test ! -S /run/docker.sock
          test ! -S /run/devspace-docker/docker.sock
          /usr/local/libexec/github-runner-devspace/assert-user-bus-inaccessible.py \
            /run/user/45001/bus
          test ! -e /home/benjamin
          test ! -e /workspace/DevSpace
          test -z "$(find /srv/devspace -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"
          test -z "$(find /data/coolify -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"
          docker info --format '{{json .SecurityOptions}}' | grep -qi rootless
          docker compose version

      - name: Verify dedicated Docker state is empty
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker ps -aq | wc -l)" -eq 0
          test "$(docker volume ls -q | wc -l)" -eq 0
          test "$(docker network ls --filter type=custom -q | wc -l)" -eq 0
