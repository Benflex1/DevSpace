name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Clean-clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: "11.13.0"
          cache: true
          cache_dependency_path: pnpm-lock.yaml
          run_install: false

      - name: Verify tool versions
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.13.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate raw preview-gateway Compose contract
        run: pnpm preview-gateway:check

      - name: Validate rendered preview-gateway Compose contract
        run: |
          docker compose version
          DEVSPACE_GATEWAY_UID=12345 \
          DEVSPACE_GATEWAY_GID=12346 \
          DEVSPACE_PREVIEW_INGRESS_PORT=18081 \
          docker compose \
            -f deploy/preview-gateway/compose.yaml \
            config \
            --format json \
            > "$RUNNER_TEMP/devspace-preview-gateway-compose.json"
          node tooling/check-preview-gateway-compose-render.mjs \
            "$RUNNER_TEMP/devspace-preview-gateway-compose.json"

      - name: Validate rendered Coolify Raw Compose adapter
        run: |
          if env -u DEVSPACE_COOLIFY_PROXY_NETWORK \
            docker compose \
              -f deploy/preview-gateway/compose.coolify.yaml \
              config >/dev/null 2>&1
          then
            echo "Coolify adapter unexpectedly accepted an unset proxy network" >&2
            exit 1
          fi
          if DEVSPACE_COOLIFY_PROXY_NETWORK= \
            docker compose \
              -f deploy/preview-gateway/compose.coolify.yaml \
              config >/dev/null 2>&1
          then
            echo "Coolify adapter unexpectedly accepted an empty proxy network" >&2
            exit 1
          fi
          DEVSPACE_GATEWAY_UID=12345 \
          DEVSPACE_GATEWAY_GID=12346 \
          DEVSPACE_PREVIEW_INGRESS_PORT=18081 \
          DEVSPACE_COOLIFY_PROXY_NETWORK=devspace-ci-temporary-proxy \
          docker compose \
            -f deploy/preview-gateway/compose.coolify.yaml \
            config \
            --format json \
            > "$RUNNER_TEMP/devspace-preview-gateway-coolify-compose.json"
          node tooling/check-preview-gateway-coolify-compose-render.mjs \
            "$RUNNER_TEMP/devspace-preview-gateway-coolify-compose.json" \
            devspace-ci-temporary-proxy

      - name: Smoke test pinned Caddy preview gateway
        run: pnpm preview-gateway:caddy-smoke

      - name: Smoke test Coolify Raw Compose network adapter
        run: pnpm preview-gateway:coolify-smoke

      - name: Verify workspace graph
        run: pnpm workspace:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify agent contracts
        run: pnpm contracts:check

      - name: Verify Project Options schema
        run: pnpm schema:check

      - name: Verify SQLite migrations
        run: pnpm db:migrate:test

      - name: Verify migration drift
        run: pnpm db:check

      - name: Assert checkout remains clean
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
