services:
  caddy:
    build:
      context: ../..
      dockerfile: deploy/preview-gateway/Caddy.Dockerfile
    user: "${DEVSPACE_GATEWAY_UID:-1000}:${DEVSPACE_GATEWAY_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    volumes:
      - type: bind
        source: ${DEVSPACE_GATEWAY_HOST_DIR:-/srv/devspace/gateway}
        target: /run/devspace/gateway
        bind:
          create_host_path: false

  preview-gateway-host:
    build:
      context: ../..
      dockerfile: deploy/preview-gateway/Dockerfile
    user: "${DEVSPACE_GATEWAY_UID:-1000}:${DEVSPACE_GATEWAY_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEVSPACE_PREVIEW_PROBE_SOCKET: /run/devspace/gateway/preview-probe.sock
      DEVSPACE_PREVIEW_LEASE_RESOLVER_SOCKET: /run/devspace/gateway/lease-resolver.sock
    volumes:
      - type: bind
        source: ${DEVSPACE_GATEWAY_HOST_DIR:-/srv/devspace/gateway}
        target: /run/devspace/gateway
        bind:
          create_host_path: false

  preview-ingress-connector:
    build:
      context: ../..
      dockerfile: deploy/preview-gateway/Dockerfile
    user: "${DEVSPACE_GATEWAY_UID:-1000}:${DEVSPACE_GATEWAY_GID:-1000}"
    restart: unless-stopped
    command: ["node", "dist/connector-index.js"]
    expose:
      - "${DEVSPACE_PREVIEW_INGRESS_PORT:-8080}"
    environment:
      NODE_ENV: production
      DEVSPACE_PREVIEW_INGRESS_PORT: "${DEVSPACE_PREVIEW_INGRESS_PORT:-8080}"
      DEVSPACE_PREVIEW_HTTP_SOCKET: /run/devspace/gateway/ingress/preview-http.sock
    volumes:
      - type: bind
        source: ${DEVSPACE_GATEWAY_HOST_DIR:-/srv/devspace/gateway}/ingress
        target: /run/devspace/gateway/ingress
        read_only: true
        bind:
          create_host_path: false
